services:
  mysql:
    image: mysql:8.4
    container_name: rumbo-mysql
    environment:
      MYSQL_DATABASE: rumbo
      MYSQL_USER: ${DB_USERNAME:-rumbo}
      MYSQL_PASSWORD: ${DB_PASSWORD:-rumbo}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20
  mailpit:
    image: axllent/mailpit:latest
    container_name: rumbo-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
volumes:
  mysql-data:
