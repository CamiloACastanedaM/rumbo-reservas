spring:
  datasource:
    url: jdbc:h2:mem:rumbo;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  # data.sql is loaded by SeedRunner only into an empty database
  sql:
    init:
      mode: never
  mail:
    host: localhost
    port: 1025
app:
  seed: false
  upload-dir: target/test-uploads
  cors-origins: http://localhost:5173
  frontend-url: http://localhost:5173
  mail:
    from: test@rumbo.local

# Swagger stays on in production: the API docs are part of the delivery.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
