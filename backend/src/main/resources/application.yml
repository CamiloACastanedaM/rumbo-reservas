server:
  port: ${PORT:8080}

spring:
  application:
    name: rumbo-api
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/rumbo}
    username: ${DB_USERNAME:rumbo}
    password: ${DB_PASSWORD:rumbo}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  # data.sql is loaded by SeedRunner only into an empty database
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 60MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    # false for local Mailpit; true for a real SMTP provider
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}

app:
  upload-dir: ${UPLOAD_DIR:uploads}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  jwt:
    # 32+ characters. Empty = random key per start (sessions end when the API restarts).
    secret: ${JWT_SECRET:}
    ttl: PT12H
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  mail:
    from: ${MAIL_FROM:Rumbo <no-responder@rumbo.local>}
    # Set in production to send through Brevo's HTTPS API instead of SMTP
    brevo-api-key: ${BREVO_API_KEY:}

# Swagger stays on in production: the API docs are part of the delivery.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
